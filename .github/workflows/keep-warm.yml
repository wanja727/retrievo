# 공부하는 시간대(한국 시간 7시~밤 12시)에 백엔드를 깨워 둔다.
# Cloud Run은 요청이 없으면 15분쯤 뒤에 0대로 내려가고, 다시 켜질 때 첫 요청이 9초쯤 걸린다.
# 10분마다 가벼운 요청을 하나 보내 내려가지 않게 한다. Cloud Run은 요청을 처리하는 시간만 과금해서 비용은 거의 없다.
# GitHub의 예약 실행은 몇 분씩 늦어지거나 가끔 빠질 수 있어서, 늘 켜져 있다고 보장하지는 않는다.
name: Keep backend warm

on:
  schedule:
    # cron은 UTC다. 한국 시간 = UTC + 9시간. 사용량이 몰리는 정각을 피해 7분, 17분, ...에 돈다
    # 한국 6:57에 한 번 먼저 깨워 7시에 바로 쓸 수 있게 하고, 7:07 ~ 23:57에는 10분마다 깨운다
    - cron: "57 21 * * *"
    - cron: "7-59/10 22,23,0-14 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: 백엔드 깨우기
        env:
          URL: ${{ vars.RETRIEVO_PUBLIC_URL }}/api/me
        run: |
          # 로그인하지 않은 요청이라 401이 정상이다. 응답이 오면 서버가 켜져 있는 것이다
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 --retry 2 "$URL")
          echo "$URL -> $code"
          test "$code" = 401
