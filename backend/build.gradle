plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.10'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'app.retrievo'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// IntelliJ의 "래퍼 작업"과 gradle wrapper가 쓰는 버전. CI와 같다
wrapper {
    gradleVersion = '8.14.3'
}

// 빌드 시각을 앱에 넣는다 (BuildProperties). 문제 가져오기가 서버 코드가 바뀌었는지 이것으로 안다
springBoot {
    buildInfo()
}

repositories {
    mavenCentral()
}

// Docker Engine 29 이상과 호환되는 Testcontainers 버전
ext['testcontainers.version'] = '1.21.4'

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // 카카오 로그인(OAuth2)과 로그인 세션. 세션은 Postgres에 둔다 (ADR-010 변경: Redis 대신 JDBC)
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.session:spring-session-jdbc'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml'
    // 핵심 질문의 답을 채점한다 (ADR-027)
    implementation 'com.anthropic:anthropic-java:3.3.0'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// 문제 파일 형식 검사 (콘텐츠 저장소 CI용). 스프링과 DB 없이 돈다
// 예: gradle -p backend checkContent -PcontentDir=../dev-lessons/content/questions
tasks.register('checkContent', JavaExec) {
    group = 'verification'
    description = '문제 파일(YAML) 형식을 검사한다. -PcontentDir=<디렉터리>'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'app.retrievo.content.file.ContentCheck'
    args = [project.findProperty('contentDir') ?: 'missing-contentDir']
}

// 채점 품질 측정 (ADR-027). 사람이 판정을 정해 둔 답 세트를 모델에 채점시켜 얼마나 맞는지 센다
// 예: ./gradlew gradeEval -Pmodels=claude-haiku-5-5,claude-sonnet-5-5
// ANTHROPIC_API_KEY가 없으면 답 세트가 문제 파일과 맞는지만 확인한다. 모델을 부르면 돈이 든다
tasks.register('gradeEval', JavaExec) {
    group = 'verification'
    description = '채점 품질을 잰다. -PcontentDir=<문제 파일 디렉터리> -Pmodels=<모델,모델>'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'app.retrievo.grading.GradingEval'
    args = [
        project.findProperty('contentDir') ?: '../../dev-lessons/content/questions',
        project.findProperty('models') ?: 'claude-haiku-5-5,claude-sonnet-5-5',
    ]
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat 'full'
    }
}
